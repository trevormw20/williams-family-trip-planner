<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private trip planner</title><style>body{margin:0;font:16px/1.5 system-ui;background:#faf6ed;color:#102844}header{padding:16px 22px;background:#102844;color:#fff3d1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input{height:44px;box-sizing:border-box;line-height:22px;font:inherit;padding:10px;border:1px solid #bba16b;border-radius:8px}button{cursor:pointer}#login,#responses{margin:24px;padding:24px;background:white;border-radius:16px}#planner{display:block;border:0;width:100%;height:calc(100vh - 115px)}#status{flex:1}details{margin:12px 0}label{display:block}a{color:#bfe5ff}[hidden]{display:none!important}</style></head><body><header><strong>✨ Your trip planning desk</strong><span id="status" role="status">Connecting…</span><button id="save" hidden>Save now</button><button id="review" hidden>Family ride choices</button><button id="backup" hidden>Download unsaved draft</button><button id="logout" hidden>Sign out</button></header><section id="login" hidden><h1>Organizer sign-in</h1><p>Your planning decisions and budget are private.</p><form><label>Organizer access code<input type="password" autocomplete="current-password" required></label><button>Open planner</button></form></section><section id="responses" hidden><h2>Family ride choices</h2><p>These are saved directly by each family. Importing updates their ride selections in your planner.</p><div id="response-list"></div><button id="apply">Use these choices in my planner</button><button id="close">Close</button></section><iframe id="planner" title="Complete private trip planner" sandbox="allow-scripts allow-modals allow-downloads allow-popups allow-popups-to-escape-sandbox" hidden></iframe><script type="module">
import {connect} from '../client.js';
const $=s=>document.querySelector(s),status=$('#status');let client,sha=null,latest=null,saved=null,timer,busy=false,conflict=false,catalog,responses=[];
const say=text=>status.textContent=text;
async function save(){clearTimeout(timer);if(busy||conflict||!latest||JSON.stringify(latest)===saved)return;busy=true;const snapshot=JSON.stringify(latest);say('Saving to private GitHub…');try{const result=await client.api('/planner',{method:'PUT',body:JSON.stringify({sha,data:JSON.parse(snapshot)})});sha=result.sha;saved=snapshot;say('Saved to GitHub · '+new Date().toLocaleTimeString());}catch(e){conflict=e.status===409;say(e.message+' Your draft is still open; download it before reloading.')}finally{busy=false;if(!conflict&&saved===snapshot&&JSON.stringify(latest)!==saved)timer=setTimeout(save,1500)}}
async function open(){const [state,documentData]=await Promise.all([client.api('/planner'),client.api('/planner-document')]);if(!documentData.html)throw Error('Organizer document not ready');sha=state.sha;latest=state.data||{};saved=JSON.stringify(latest);const initial=JSON.stringify(latest).replaceAll('<','\\u003c');const base=new URL('../',location.href).href;const prelude='<base href="'+base+'"><script>window.__INITIAL_PLANNER_STATE__='+initial+';<\/script>';$('#planner').srcdoc=documentData.html.replace('<head>','<head>'+prelude);$('#planner').hidden=false;$('#login').hidden=true;for(const id of ['save','review','backup','logout'])$('#'+id).hidden=false;say(state.data?'Loaded from GitHub':'New planner · changes will save to GitHub')}
window.addEventListener('message',async e=>{if(e.source!==$('#planner').contentWindow)return;if(e.data?.type==='planner-restore'){while(busy)await new Promise(r=>setTimeout(r,100));await save();if(JSON.stringify(latest)===saved)await open();return}if(e.data?.type!=='planner-state')return;latest=e.data.values;if(JSON.stringify(latest)!==saved){say('Unsaved changes…');clearTimeout(timer);timer=setTimeout(save,1500)}});
window.addEventListener('beforeunload',e=>{if(latest&&JSON.stringify(latest)!==saved){e.preventDefault();e.returnValue=''}});
$('#save').onclick=save;$('#logout').onclick=()=>{if(latest&&JSON.stringify(latest)!==saved&&!confirm('There are unsaved changes. Sign out anyway?'))return;client.logout()};
$('#backup').onclick=()=>{const values=latest||{},url=URL.createObjectURL(new Blob([JSON.stringify({format:'williams-planner-backup-v1',values},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='williams-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#review').onclick=async()=>{try{[catalog,{responses}]=await Promise.all([client.api('/catalog'),client.api('/responses')]);const {links}=await client.api('/family-links');const list=$('#response-list');list.replaceChildren();for(const item of responses){const detail=document.createElement('details'),title=document.createElement('summary');title.textContent=item.family+' · '+(item.data?'Saved '+new Date(item.data.updatedAt).toLocaleString():'Not submitted');detail.append(title);if(links[item.family]){const label=document.createElement('label');label.textContent='Share this family link';const input=document.createElement('input');input.readOnly=true;input.value=links[item.family];input.style.width='100%';input.onclick=()=>input.select();label.append(input);detail.append(label)}for(const [person,rides] of Object.entries(item.data?.choices||{})){const p=document.createElement('p');p.textContent=(catalog.people.find(x=>x.id===person)?.name||person)+': '+(rides.map(id=>catalog.rides.find(r=>r.id===id)?.name||id).join(', ')||'No rides selected');detail.append(p)}list.append(detail)}$('#responses').hidden=false}catch(e){say(e.message)}};
$('#apply').onclick=()=>{const choices={};for(const response of responses){if(!response.data)continue;for(const person of catalog.people.filter(p=>p.family===response.family)){if(!Object.hasOwn(response.data.choices,person.id))continue;for(const ride of catalog.rides)choices[person.id+'_'+ride.id]=response.data.choices[person.id].includes(ride.id)}}$('#planner').contentWindow.postMessage({type:'apply-family-rides',choices},'*');$('#responses').hidden=true};$('#close').onclick=()=>$('#responses').hidden=true;
$('#login form').onsubmit=async e=>{e.preventDefault();try{await client.login($('#login input').value);$('#login input').value='';await open()}catch(error){say(error.message)}};
try{client=await connect('planner');if(client.authenticated)await open();else{$('#login').hidden=false;say('Sign in to open your private planner')}}catch(e){say(e.message);$('#login').hidden=!client}
</script></body></html>
